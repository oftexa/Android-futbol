name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Guardas de rutas protegidas y tamaño del cambio
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
          ETIQUETAS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: pnpm guardas --base "$BASE" --etiquetas "$ETIQUETAS"

      - run: pnpm verify

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      - name: Build web y cap sync android
        run: pnpm --filter @af4/web android:sync

      - name: APK de depuración (assembleDebug)
        run: pnpm --filter @af4/web android:apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-futbol-4-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
